<style>
/* Layout: uma coluna de celular (até 480px): cabeçalho, data, bebê no saco amniótico, faixa de semanas, cartões de conteúdo. */
:root{
  --bg:#F6F2FA; --surface:#FFFFFF; --ink:#2B2236; --muted:#6B617A; --line:#E6DEEE;
  --accent:#D9506B; --accent-ink:#FFFFFF; --lilac:#6C5BA7; --lilac-soft:#ECE7F7;
  --sac:#FFDCD6; --sac2:#FFF3F0;
  --t1:#3F9C89; --t2:#D9506B; --t3:#6C5BA7; --t1s:#D5EEE9; --t2s:#F9DDE3; --t3s:#E3DEF3;
  --font-display:'Fraunces',Georgia,serif; --font-body:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16111C; --surface:#211A2B; --ink:#F3EDF8; --muted:#B4A9C4; --line:#362C44;
    --accent:#F0869A; --accent-ink:#2B1018; --lilac:#B2A4EA; --lilac-soft:#2E2641;
    --sac:#4A2C3A; --sac2:#2C1B27;
    --t1:#6CCDB9; --t2:#F0869A; --t3:#B2A4EA; --t1s:#1F3A36; --t2s:#432631; --t3s:#2E2641;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16111C; --surface:#211A2B; --ink:#F3EDF8; --muted:#B4A9C4; --line:#362C44;
  --accent:#F0869A; --accent-ink:#2B1018; --lilac:#B2A4EA; --lilac-soft:#2E2641;
  --sac:#4A2C3A; --sac2:#2C1B27;
  --t1:#6CCDB9; --t2:#F0869A; --t3:#B2A4EA; --t1s:#1F3A36; --t2s:#432631; --t3s:#2E2641;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3,p,dl,dd,ul{margin:0;padding:0}
ul{list-style:none}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}

.app{max-width:480px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:-.01em}
.brand svg{width:30px;height:30px;flex:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px}
.kicker{font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fine{font-size:13px;color:var(--muted)}
.btn{border:0;border-radius:999px;padding:12px 20px;min-height:44px;font-weight:800;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--lilac-soft);color:var(--lilac)}
.btn.small{padding:8px 14px;min-height:40px;font-size:14px}
.btn:active{transform:scale(.98)}

/* data */
.datecard h2{font-family:var(--font-display);font-size:20px;line-height:1.25}
.datecard .lead{margin-top:4px;color:var(--muted);font-size:15px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px;background:var(--lilac-soft);padding:5px;border-radius:999px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:block;text-align:center;padding:10px 6px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;color:var(--lilac)}
.seg input:checked+label{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(40,20,60,.15)}
.seg input:focus-visible+label{outline:3px solid var(--lilac);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-weight:700;font-size:14px}
.field input{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;min-height:48px;width:100%}
.formrow{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.msg{color:var(--accent);font-weight:700;font-size:14px;margin-top:10px}
.summary{display:flex;align-items:center;justify-content:space-between;gap:12px}
.summary p{font-size:15px}
.summary b{display:block;font-family:var(--font-display);font-size:18px}

/* herói */
.hero{text-align:center;padding:16px 16px 20px}
.pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:28px}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:800}
.pill.t1{background:var(--t1s);color:var(--t1)}
.pill.t2{background:var(--t2s);color:var(--t2)}
.pill.t3{background:var(--t3s);color:var(--t3)}
.pill.ex{background:var(--lilac-soft);color:var(--lilac)}
.sacwrap{width:min(100%,280px);margin:6px auto 0}
.sacwrap svg{display:block;width:100%;height:auto}
.baby{animation:bob 6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.baby{animation:none}}
.wk-label{margin-top:4px}
.wk-num{font-family:var(--font-display);font-weight:700;font-size:76px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sub{margin-top:6px;color:var(--muted);font-size:15px}
.sub b{color:var(--ink)}
.track{display:flex;gap:4px;margin:16px 4px 6px}
.seg-t{height:10px;border-radius:99px;overflow:hidden;position:relative}
.seg-t i{position:absolute;inset:0 auto 0 0;display:block;border-radius:99px}
.seg-t.s1{flex:14;background:var(--t1s)} .seg-t.s1 i{background:var(--t1)}
.seg-t.s2{flex:14;background:var(--t2s)} .seg-t.s2 i{background:var(--t2)}
.seg-t.s3{flex:12;background:var(--t3s)} .seg-t.s3 i{background:var(--t3)}
.track-l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:700;margin:0 4px}
.back{margin-top:12px}

/* faixa de semanas */
.nav{display:flex;align-items:center;gap:6px}
.arrow{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.arrow:disabled{opacity:.35;cursor:default}
.strip{flex:1;min-width:0;position:relative;display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding:4px 2px}
.strip::-webkit-scrollbar{display:none}
.wk{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-variant-numeric:tabular-nums;cursor:pointer;scroll-snap-align:center;position:relative}
.wk.t1{border-color:var(--t1s)} .wk.t2{border-color:var(--t2s)} .wk.t3{border-color:var(--t3s)}
.wk.sel{background:var(--lilac);border-color:var(--lilac);color:#fff}
:root[data-theme="dark"] .wk.sel{color:#1B1330}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wk.sel{color:#1B1330}}
.wk.now::after{content:"";position:absolute;left:50%;bottom:4px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--accent)}

/* tamanho */
.size{display:flex;gap:16px;align-items:center}
.fruit{flex:none;width:112px;height:112px;background:var(--lilac-soft);border-radius:20px;display:grid;place-items:center}
.fruit svg{width:100%;height:100%;display:block}
.size h2{font-family:var(--font-display);font-size:21px;line-height:1.2;margin-top:2px;text-wrap:balance}
.stats{display:flex;gap:20px;margin-top:10px}
.stats dt{font-size:12.5px;color:var(--muted);font-weight:700}
.stats dd{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}

/* conteúdo */
.info{border-left:6px solid var(--lilac)}
.info.mom{border-left-color:var(--accent)}
.info.tip{border-left-color:var(--t1)}
.info h3{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.info p{font-size:17px;line-height:1.55;max-width:65ch}

.cardtitle{font-family:var(--font-display);font-size:20px;line-height:1.25}
.miles{display:flex;flex-direction:column;margin-top:10px}
.miles li{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.miles li:first-child{border-top:0}
.miles p{font-size:15px}
.miles small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.miles .st{flex:none;font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--lilac-soft);color:var(--lilac);white-space:nowrap}
.miles li.now .st{background:var(--accent);color:var(--accent-ink)}
.miles li.past{opacity:.55}
textarea{width:100%;min-height:104px;margin-top:10px;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;resize:vertical}
.share{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.disc{font-size:13px;color:var(--muted);text-align:center;padding:0 8px}
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" style="fill:var(--sac)"/><circle cx="12" cy="13" r="5" fill="#F6B9A3"/><path d="M15 15q8 1 7 8" stroke="#F6B9A3" stroke-width="7" stroke-linecap="round" fill="none"/></svg>
      Semana a Semana
    </div>
  </header>

  <section class="card datecard" id="datecard" aria-live="polite"></section>

  <section class="card hero" id="hero" aria-live="polite"></section>

  <nav class="nav" aria-label="Escolher semana">
    <button class="arrow" id="prev" aria-label="Semana anterior"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.5 10l6 6"/></svg></button>
    <div class="strip" id="strip" role="group" aria-label="Semanas de 1 a 40"></div>

  </nav>

  <section class="card" id="sizecard"></section>
  <p class="fine" id="sizenote" style="margin-top:-4px;padding:0 6px"></p>

  <section class="card info" id="baby"></section>
  <section class="card info mom" id="mom"></section>
  <section class="card info tip" id="tip"></section>

  <section class="card" id="miles"></section>

  <section class="card">
    <h2 class="cardtitle" id="notetitle">Seu diário</h2>
    <p class="fine" style="margin-top:2px">Anote como você se sentiu, o que o médico disse, o nome que você está pensando. Fica salvo neste aparelho.</p>
    <label for="note" class="fine" style="display:block;margin-top:10px;font-weight:700">Anotação da semana <span id="notewk"></span></label>
    <textarea id="note" placeholder="Hoje eu senti…"></textarea>
  </section>

  <section class="card share">
    <button class="btn ghost" id="copy">Copiar resumo da semana</button>
    <span class="fine" id="copied" role="status"></span>
  </section>

  <p class="disc">Conteúdo informativo, com valores médios. Cada gestação é única. Este app não substitui o pré-natal: converse sempre com seu médico ou enfermeira.</p>
</main>

var TX=[null,
['A contagem da gestação começa no primeiro dia da última menstruação, por isso ainda não existe bebê. O corpo se prepara para ovular.','Você pode estar menstruada. A gravidez ainda não aconteceu.','Se está planejando engravidar, converse com seu médico sobre começar o ácido fólico.'],
['Um óvulo amadurece. A ovulação costuma acontecer perto do fim desta semana ou no começo da próxima.','Alguns sinais sutis podem aparecer: muco mais claro e elástico e um leve desconforto no baixo-ventre.','Para quem quer engravidar, o período fértil é o mais indicado para as relações.'],

['O embrião se prende à parede do útero. Começam a se formar a placenta e o saco amniótico.','Pode haver um sangramento leve de implantação e cólica fraca. A menstruação atrasa.','Faça o teste de farmácia a partir do atraso e marque a primeira consulta de pré-natal.'],
['Forma-se o tubo neural, que dará origem ao cérebro e à medula. O coração começa a se desenhar.','Sono, seios sensíveis e enjoo leve podem aparecer.','Siga a orientação do médico sobre o ácido fólico e agende o pré-natal.'],
['O coração começa a bater e já pode aparecer no ultrassom. Surgem brotos que viram braços e pernas.','Enjoo, cansaço e vontade frequente de ir ao banheiro são comuns.','Coma pouco e várias vezes ao dia para aliviar o enjoo.'],
['O cérebro cresce rápido. Formam-se olhos, narinas, e as mãos têm formato de pazinha.','Saliva em excesso, gosto metálico e aversão a cheiros podem aparecer.','Tome água em pequenos goles ao longo do dia.'],
['Os dedos começam a se separar e as pálpebras se formam. O embrião já se mexe, mas você ainda não sente.','O útero cresce, mas a barriga quase não aparece. Oscilar de humor é normal.','Se ainda não foi à primeira consulta, marque agora e pergunte sobre os exames de rotina.'],
['Termina a fase de embrião e começa a de feto. Os órgãos principais estão formados e passam a amadurecer.','Cansaço forte, seios maiores e azia podem aparecer.','Roupas confortáveis e sutiã sem aro ajudam nesta fase.'],
['Os dedos estão separados, os ossinhos começam a endurecer e as unhas aparecem.','O enjoo costuma estar no auge. As veias podem ficar mais visíveis.','Prefira refeições leves e evite ficar muito tempo sem comer.'],

['Aparecem os reflexos: o bebê abre e fecha as mãos e faz movimentos de sucção. Os rins já produzem urina.','Para muitas mulheres o enjoo começa a diminuir e a energia volta.','O ultrassom de translucência nucal costuma ser feito entre 11 e 14 semanas. Confirme com seu médico.'],
['Fim do primeiro trimestre. O risco de perda gestacional diminui bastante e as impressões digitais começam a se formar.','Mais disposição e apetite. A barriga começa a aparecer.','É uma boa hora para contar a novidade, se você quiser.'],
['O pescoço se define e o rosto ganha expressões. Surgem pelinhos finos, o lanugo, e o bebê começa a fazer caretas.','Começa o segundo trimestre: o enjoo costuma ir embora e a barriga cresce.','Hidrate a pele da barriga e use protetor solar para evitar manchas.'],
['O bebê pode reagir à luz forte mesmo de olhos fechados, e os ossos continuam endurecendo.','Nariz entupido e gengiva que sangra são comuns.','Escove os dentes com delicadeza e faça uma revisão no dentista.'],
['Os músculos do rosto trabalham e o bebê faz caretas. Os olhos se movem e o esqueleto fica mais firme.','Algumas mulheres sentem os primeiros movimentos, como bolhinhas. No primeiro filho pode demorar mais.','Durma de lado, de preferência do esquerdo, com um travesseiro entre as pernas.'],

function shade(h,p){
  var n=parseInt(h.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255,f=p<0?0:255,t=Math.abs(p);
  r=Math.round((f-r)*t+r);g=Math.round((f-g)*t+g);b=Math.round((f-b)*t+b);
  return 'rgb('+r+','+g+','+b+')';
}
function fruitSVG(f){
  var n=f[0],shape=f[2],c=f[3],s=f[4],x=f[5];
  var has=function(k){return x.indexOf(k)>-1;};
  var head='<svg viewBox="0 0 120 120" role="img" aria-label="'+n+'">';
  if(shape==='dot'){
    return head+'<circle cx="60" cy="64" r="'+s+'" fill="'+c+'"/></svg>';
  }
  var dk=shade(c,-.28),lt=shade(c,.35);
  var shadow='<ellipse cx="60" cy="113" rx="34" ry="4" fill="#000" opacity=".1"/>';
  var g0='<g transform="translate(60 60) scale('+s+') translate(-60 -60)">';
  var i,o='';
  if(shape==='leafy'){
    var ang=[-62,-31,0,31,62];
    for(i=0;i<5;i++){o+='<ellipse cx="60" cy="60" rx="21" ry="46" transform="rotate('+ang[i]+' 60 104)" fill="'+(i%2?c:dk)+'"/>';}
    o+='<ellipse cx="60" cy="62" rx="16" ry="38" fill="'+lt+'" opacity=".55"/>';
    return head+shadow+g0+o+'</g></svg>';
  }
  if(shape==='cauli'){
    var leaf=shade('#5FA24A',c==='#EFE9D8'?0:-.1);
    o+='<ellipse cx="34" cy="86" rx="16" ry="30" transform="rotate(-40 34 86)" fill="'+leaf+'"/>';
    o+='<ellipse cx="86" cy="86" rx="16" ry="30" transform="rotate(40 86 86)" fill="'+leaf+'"/>';
    o+='<ellipse cx="60" cy="90" rx="14" ry="26" fill="'+shade(leaf,-.12)+'"/>';
    var cs=[[38,52,22],[82,52,22],[60,36,24],[50,66,24],[72,66,24]];
    for(i=0;i<cs.length;i++){o+='<circle cx="'+cs[i][0]+'" cy="'+cs[i][1]+'" r="'+cs[i][2]+'" fill="'+c+'" stroke="'+dk+'" stroke-width="1.5" stroke-opacity=".5"/>';}
    return head+shadow+g0+o+'</g></svg>';
  }

  else if(shape==='capsule'||shape==='pod'){el='<rect x="8" y="44" width="104" height="32" rx="16" transform="rotate(-24 60 60)"/>';}
  else if(shape==='carrot'){el='<path d="M14 96Q12 86 20 80L88 44Q102 38 106 52Q108 64 96 72L34 100Q22 104 14 96Z"/>';}
  else if(shape==='banana'){el='<path d="M22 34Q28 94 96 96Q106 96 106 86Q100 84 92 82Q52 74 46 30Q44 20 34 22Q24 24 22 34Z"/>';}
  else if(shape==='pine'){el='<ellipse cx="60" cy="76" rx="30" ry="38"/>';}
  if(has('hi')){deco+='<ellipse cx="42" cy="40" rx="12" ry="22" fill="#fff" opacity=".22" transform="rotate(30 42 40)"/>';}
  if(has('stripes')){
    var xs=has('wide')?[22,40,58,76,94]:[26,43,60,77,94];
    for(i=0;i<xs.length;i++){deco+='<path d="M'+xs[i]+' 10Q'+(xs[i]+(i%2?-12:12))+' 62 '+xs[i]+' 116" stroke="'+dk+'" stroke-width="6" fill="none" opacity=".38"/>';}
  }
  if(has('dots')){
    for(i=0;i<24;i++){deco+='<circle cx="'+(30+(i%5)*15+((Math.floor(i/5)%2)*7))+'" cy="'+(34+Math.floor(i/5)*14)+'" r="4.2" fill="'+lt+'" opacity=".7"/>';}
  }
  if(has('kernels')){
    for(i=0;i<40;i++){deco+='<circle cx="'+(14+(i%10)*10)+'" cy="'+(52+Math.floor(i/10)*8)+'" r="3.4" fill="'+lt+'" opacity=".75" transform="rotate(-24 60 60)"/>';}
  }
  if(shape==='pod'){
    for(i=0;i<5;i++){deco+='<circle cx="'+(26+i*17)+'" cy="'+(80-i*7)+'" r="8" fill="'+lt+'" opacity=".85"/>';}
  }
  if(shape==='carrot'){
    for(i=0;i<4;i++){deco+='<path d="M'+(30+i*16)+' '+(94-i*12)+'l10 -6" stroke="'+dk+'" stroke-width="3" opacity=".4" stroke-linecap="round"/>';}
    ext+='<g fill="#5FAE45"><ellipse cx="104" cy="46" rx="6" ry="15" transform="rotate(25 104 46)"/><ellipse cx="108" cy="56" rx="6" ry="15" transform="rotate(70 108 56)"/><ellipse cx="97" cy="40" rx="6" ry="15" transform="rotate(-8 97 40)"/></g>';
  }
  if(shape==='pine'){
    for(i=-4;i<=4;i++){
      deco+='<path d="M'+(60+i*14-44)+' 30L'+(60+i*14+44)+' 124" stroke="'+dk+'" stroke-width="2.5" opacity=".45"/>';
      deco+='<path d="M'+(60+i*14+44)+' 30L'+(60+i*14-44)+' 124" stroke="'+dk+'" stroke-width="2.5" opacity=".45"/>';
    }
    ext+='<g fill="#4E9A3F"><path d="M60 42L48 6L58 28L60 2L64 28L74 8Z"/><path d="M60 42L38 20L56 36Z"/><path d="M60 42L82 20L64 36Z"/></g>';
  }
  if(shape==='banana'){ext+='<circle cx="34" cy="22" r="5" fill="#6B4A2B"/>';}
  if(has('stem')){ext+='<path d="M60 20Q60 8 66 4" stroke="#6B4A2B" stroke-width="5" fill="none" stroke-linecap="round"/>';}
  if(has('leaf')){ext+='<path d="M64 12Q84 0 96 14Q76 24 64 12Z" fill="#6DAA4A"/>';}
  if(has('crown')){ext+='<path d="M50 24L60 14L70 24Z" fill="'+dk+'"/>';}
  if(has('cap')){ext+='<path d="M38 30Q60 10 82 30Q60 40 38 30Z" fill="#4E8F3A"/><path d="M60 20Q60 8 66 4" stroke="#4E8F3A" stroke-width="5" fill="none" stroke-linecap="round"/>';}
  if(has('dots3')){ext+='<g fill="#3E2A1A"><circle cx="46" cy="42" r="4.5"/><circle cx="61" cy="37" r="4.5"/><circle cx="55" cy="52" r="4.5"/></g>';}
  return head+'<defs><clipPath id="fc">'+el+'</clipPath></defs>'+shadow+g0+
    '<g fill="'+c+'">'+el+'</g><g clip-path="url(#fc)">'+deco+'</g>'+ext+'</g></svg>';
}

var SK='#F6B9A3',SK2='#EBA08A';
function babySVG(w){
  var bits='',sc=1,len=FR[w]?parseFloat(FR[w][6].replace(',','.')):0;
  var cordPos=null;
  if(w<=2){
    bits='<circle cx="100" cy="100" r="22" fill="#fff" opacity=".7"/><circle cx="100" cy="100" r="12" fill="'+SK2+'"/>';
  }else if(w===3){
    var cl=[[92,93],[108,93],[92,108],[108,108]];
    for(var k=0;k<4;k++){bits+='<circle cx="'+cl[k][0]+'" cy="'+cl[k][1]+'" r="8.5" fill="'+SK+'" stroke="'+SK2+'" stroke-width="2"/>';}
  }else if(w<=8){
    sc=.24+.06*(w-4);
    bits+='<path d="M100 98Q132 104 128 132" stroke="'+SK+'" stroke-width="30" stroke-linecap="round" fill="none"/>';
    bits+='<path d="M128 132Q126 150 112 154" stroke="'+SK+'" stroke-width="15" stroke-linecap="round" fill="none"/>';
    bits+='<circle cx="86" cy="86" r="23" fill="'+SK+'"/>';
    if(w>=6){bits+='<circle cx="112" cy="102" r="6" fill="'+SK2+'"/><circle cx="132" cy="124" r="6" fill="'+SK2+'"/><circle cx="76" cy="84" r="2.6" fill="#3A2A2A"/>';}
    bits='<g transform="translate(100 100) scale('+sc+') translate(-103 -112)">'+bits+'</g>';
  }else{
    var t=(w-9)/31,r=Math.pow(Math.min(len,51)/51,.8);
    sc=.34+.66*r;
    var hr=36-8*t,bl=30+44*t,tw=36+12*t,y2=88+bl,hx=72,hy=68;
    var g='';
    g+='<path d="M96 88Q140 '+(90+bl*.35)+' 120 '+y2+'" stroke="'+SK+'" stroke-width="'+tw+'" stroke-linecap="round" fill="none"/>';
    g+='<path d="M122 '+(y2-6)+'Q96 '+(y2+6)+' 82 '+(y2-18)+'" stroke="'+SK2+'" stroke-width="'+(16+6*t)+'" stroke-linecap="round" fill="none"/>';
    g+='<circle cx="80" cy="'+(y2-20)+'" r="'+(7+2*t)+'" fill="'+SK2+'"/>';
    g+='<circle cx="'+hx+'" cy="'+hy+'" r="'+hr+'" fill="'+SK+'"/>';
    if(w>=10){g+='<path d="M'+(hx-hr*.62)+' '+(hy+2)+'q6 6 12 0" stroke="#4A3434" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="'+(hx-hr*.5)+'" cy="'+(hy+14)+'" r="6" fill="#E8798A" opacity=".45"/>';}
    if(w>=14){g+='<ellipse cx="'+(hx+hr*.5)+'" cy="'+(hy+6)+'" rx="4" ry="6" fill="'+SK2+'"/>';}
    if(w>=30){g+='<path d="M'+(hx-hr*.5)+' '+(hy-hr*.85)+'q16 -12 30 -2" stroke="#7A5444" stroke-width="3.2" fill="none" stroke-linecap="round" opacity=".6"/>';}
    g+='<path d="M106 100Q94 120 82 98" stroke="'+SK2+'" stroke-width="'+(11+3*t)+'" stroke-linecap="round" fill="none"/>';
    g+='<circle cx="82" cy="97" r="'+(7+2*t)+'" fill="'+SK2+'"/>';
    bits='<g transform="translate(100 100) scale('+sc+') translate(-100 -100)">'+g+'</g>';
    cordPos=[100+(122-100)*sc,100+((88+bl*.45)-100)*sc];
  }
  var cord='';
  if(w>=7){
    var bx=cordPos?cordPos[0]:112,by=cordPos?cordPos[1]:112;
    if(!cordPos){bx=100+(128-103)*sc;by=100+(118-112)*sc;}
    cord='<path d="M'+bx+' '+by+'C'+(bx+24)+' '+(by+16)+' 150 '+(by-12)+' 176 102" stroke="#E58C9B" stroke-width="4" fill="none" stroke-linecap="round"/><g clip-path="url(#sacclip)"><ellipse cx="184" cy="100" rx="12" ry="30" fill="#E58C9B" opacity=".6"/></g>';
  }
  return '<svg viewBox="0 0 200 200" role="img" aria-label="Ilustração do bebê na semana '+w+'">'+
    '<defs><radialGradient id="gs" cx="50%" cy="42%" r="62%"><stop offset="0" style="stop-color:var(--sac2)"/><stop offset="1" style="stop-color:var(--sac)"/></radialGradient>'+
    '<clipPath id="sacclip"><circle cx="100" cy="100" r="92"/></clipPath></defs>'+
    '<circle cx="100" cy="100" r="92" fill="url(#gs)"/><circle cx="100" cy="100" r="92" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>'+
    cord+'<g class="baby">'+bits+'</g></svg>';
}

/* ---------- estado ---------- */
var state={dum:addDays(today,-(18*7+3)),example:true,editing:true,mode:'dum',view:18,noteWeek:0};
function ageDays(){return diff(today,state.dum);}
function curWeek(){return clamp(Math.floor(ageDays()/7),1,40);}
function validAge(d){return d>=0&&d<=294;}
(function load(){
  var sv=store.get('sas_dum');
  if(sv){
    var p=sv.split('-').map(Number),d=new Date(p[0],p[1]-1,p[2]);
    if(!isNaN(d.getTime())&&validAge(diff(today,d))){state.dum=d;state.example=false;state.editing=false;}
  }
  state.view=curWeek();
})();
function tri(w){return w<=13?1:(w<=27?2:3);}
function iso(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;}

/* ---------- telas ---------- */

   '<h2>'+(state.example?'Veja a sua gestação':'Alterar a data')+'</h2>'+

function renderHero(){
  var w=state.view,cw=curWeek(),days=ageDays(),isCur=w===cw,t=tri(w);
  var dpp=addDays(state.dum,280),left=diff(dpp,today);
  var sub;
  if(isCur){
    var wd=Math.floor(days/7),rd=days%7;
    var done=(wd>=40)?'Você está com '+wd+' semanas'+(rd?' e '+rd+(rd===1?' dia':' dias'):''):'<b>'+wd+(wd===1?' semana':' semanas')+(rd?' e '+rd+(rd===1?' dia':' dias'):'')+'</b>';
    var rest=left>1?' · faltam '+left+' dias para o parto previsto':(left===1?' · falta 1 dia para o parto previsto':(left===0?' · hoje é a data prevista do parto':' · a data prevista foi há '+(-left)+(left===-1?' dia':' dias')));
    sub=done+rest;
  }else{
    sub='Você está na semana '+cw+'.';
  }
  var segs=[[0,14],[14,28],[28,40]],pos=isCur?days/7:w;
  var bar='';
  for(var i=0;i<3;i++){
    var f=clamp((pos-segs[i][0])/(segs[i][1]-segs[i][0]),0,1);
    bar+='<span class="seg-t s'+(i+1)+'"><i style="width:'+(f*100).toFixed(1)+'%"></i></span>';
  }
  $('#hero').innerHTML=
   '<div class="pills"><span class="pill t'+t+'">'+t+'º trimestre</span>'+(state.example?'<span class="pill ex">Exemplo</span>':'')+'</div>'+
   '<div class="sacwrap">'+babySVG(w)+'</div>'+
   '<p class="kicker wk-label">Semana</p><p class="wk-num">'+w+'</p>'+
   '<p class="sub">'+sub+'</p>'+
   '<div class="track" role="img" aria-label="Progresso: semana '+w+' de 40">'+bar+'</div>'+
   '<div class="track-l"><span>1</span><span>14</span><span>28</span><span>40</span></div>'+
   (isCur?'':'<button class="btn ghost small back" data-act="today">Voltar para a minha semana</button>');
}

  $('#miles').innerHTML=h;
}
function renderStrip(first){
  var strip=$('#strip'),cw=curWeek();
  if(!strip.children.length){
    var h='';
    for(var i=1;i<=40;i++){h+='<button class="wk t'+tri(i)+'" data-w="'+i+'" aria-label="Semana '+i+'">'+i+'</button>';}
    strip.innerHTML=h;
  }
  var btns=strip.children,sel=null;
  for(var j=0;j<btns.length;j++){
    var wn=j+1,b=btns[j];
    b.classList.toggle('sel',wn===state.view);
    b.classList.toggle('now',wn===cw);
    if(wn===state.view){b.setAttribute('aria-current','true');sel=b;}else{b.removeAttribute('aria-current');}
  }
  if(sel){
    var left=sel.offsetLeft-strip.clientWidth/2+sel.clientWidth/2;
    if(first){strip.scrollLeft=left;}
    else{try{strip.scrollTo({left:left,behavior:'smooth'});}catch(e){strip.scrollLeft=left;}}
  }
  $('#prev').disabled=state.view<=1;
  $('#next').disabled=state.view>=40;
}
function renderNote(){
  var w=state.view;
  $('#notewk').textContent=w;
  if(state.noteWeek!==w){
    $('#note').value=store.get('sas_note_'+w)||'';
    state.noteWeek=w;
  }
}
function renderAll(first){
  renderDate();renderHero();renderSize();renderText();renderMiles();renderStrip(first);renderNote();
  if(state.editing){var inp=$('#dateIn');if(inp&&!state.example){inp.value=iso(state.mode==='dum'?state.dum:addDays(state.dum,280));}}
}
function go(w){
  state.view=clamp(w,1,40);
  renderHero();renderSize();renderText();renderMiles();renderStrip(false);renderNote();
}

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-w],[data-act]');
  if(!b)return;
  if(b.hasAttribute('data-w')){go(parseInt(b.getAttribute('data-w'),10));return;}
  var a=b.getAttribute('data-act');
  if(a==='today'){go(curWeek());}
  else if(a==='edit'){state.editing=true;renderDate();var inp=$('#dateIn');if(inp){inp.value=iso(state.mode==='dum'?state.dum:addDays(state.dum,280));}}
  else if(a==='cancel'){state.editing=false;renderDate();}
});
document.addEventListener('change',function(e){
  if(e.target.name==='mode'){
    state.mode=e.target.value;
    var cur=$('#dateIn').value;
    renderDate();
    $('#dateIn').value=cur;
  }
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='dateForm')return;
  e.preventDefault();
  var v=$('#dateIn').value,msg=$('#msg');
  if(!v){msg.textContent='Escolha uma data para continuar.';return;}
  var p=v.split('-').map(Number),d=new Date(p[0],p[1]-1,p[2]);
  var dum=state.mode==='dum'?d:addDays(d,-280);
  var age=diff(today,dum);
  if(age<0){msg.textContent=state.mode==='dum'?'Essa data ainda não chegou. Informe o primeiro dia da última menstruação.':'Essa data de parto está longe demais. Confira o dia e o ano.';return;}
  if(age>294){msg.textContent=state.mode==='dum'?'Essa data indica mais de 42 semanas. Confira o dia e o ano.':'Essa data de parto já passou há muito tempo. Confira o dia e o ano.';return;}
  state.dum=dum;state.example=false;state.editing=false;
  store.set('sas_dum',iso(dum));
  state.view=curWeek();state.noteWeek=0;
  renderAll(false);
});
$('#prev').addEventListener('click',function(){go(state.view-1);});
$('#next').addEventListener('click',function(){go(state.view+1);});
document.addEventListener('keydown',function(e){
  var t=e.target&&e.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA')return;
  if(e.key==='ArrowLeft'){go(state.view-1);}
  else if(e.key==='ArrowRight'){go(state.view+1);}
});
$('#note').addEventListener('input',function(e){store.set('sas_note_'+state.view,e.target.value);});
$('#copy').addEventListener('click',function(){
  var w=state.view,f=FR[w],out=$('#copied');
  var txt=f?'Semana '+w+' da gestação: o bebê está do tamanho de '+f[1]+' '+f[0]+' ('+f[6]+', '+f[7]+').':'Semana '+w+' da gestação.';
  txt+=' '+TX[w][0];
  function ok(){out.textContent='Copiado.';setTimeout(function(){out.textContent='';},2500);}
  function fail(){out.textContent='Não foi possível copiar neste aparelho.';}
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,fail);}else{fail();}
  }catch(err){fail();}
});

renderAll(true);
})();
</script>
</body>
</html>
